<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barkalare Junior &amp; Primary School — Lunch Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#ffffff;
    --blue-deep:#0a3d8f;
    --blue:#1e63d0;
    --blue-mid:#2e7bf0;
    --blue-light:#eaf2ff;
    --blue-pale:#f5f9ff;
    --ink:#0f2647;
    --muted:#5b7194;
    --line:#dbe6f8;
    --danger:#d64545;
    --danger-light:#fdeaea;
    --success:#1f9d63;
    --success-light:#e7f8ef;
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 8px 24px -12px rgba(10,61,143,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--blue-pale);
    color:var(--ink);
    min-height:100vh;
  }
  h1,h2,h3,h4{font-family:'Fredoka',sans-serif;margin:0;color:var(--blue-deep);}
  p{margin:0;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  ::selection{background:var(--blue-light);}

  /* ---------- Shell layout ---------- */
  .app-shell{display:flex;min-height:100vh;}

  .sidebar{
    width:230px;
    flex-shrink:0;
    background:linear-gradient(180deg,var(--blue-deep),var(--blue));
    color:var(--white);
    padding:24px 16px;
    display:flex;
    flex-direction:column;
    gap:6px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 8px 20px 8px;
    border-bottom:1px solid rgba(255,255,255,0.18);
    margin-bottom:14px;
  }
  .brand .badge{
    width:40px;height:40px;border-radius:12px;background:var(--white);
    display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;
  }
  .brand .name{font-family:'Fredoka',sans-serif;font-size:15.5px;line-height:1.25;color:var(--white);}
  .brand .name small{display:block;font-family:'Inter',sans-serif;font-weight:400;font-size:11px;opacity:0.75;margin-top:2px;}

  .navlink{
    display:flex;align-items:center;gap:10px;
    padding:11px 12px;border-radius:10px;
    color:rgba(255,255,255,0.82);
    font-size:14.5px;font-weight:500;
    background:transparent;border:none;text-align:left;width:100%;
    transition:background .15s ease;
  }
  .navlink .ic{font-size:17px;width:20px;text-align:center;}
  .navlink:hover{background:rgba(255,255,255,0.10);}
  .navlink.active{background:var(--white);color:var(--blue-deep);font-weight:600;}

  .sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,0.18);}
  .admin-pill{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:rgba(255,255,255,0.12);border-radius:12px;padding:10px 12px;
  }
  .admin-pill .who{font-size:12.5px;}
  .admin-pill .who b{display:block;font-size:13.5px;}
  .pill-btn{
    background:var(--white);color:var(--blue-deep);border:none;border-radius:8px;
    padding:6px 10px;font-size:12px;font-weight:600;
  }
  .pill-btn.ghost{background:rgba(255,255,255,0.15);color:var(--white);}

  .main-wrap{flex:1;min-width:0;display:flex;flex-direction:column;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 32px;background:var(--white);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:5;flex-wrap:wrap;gap:12px;
  }
  .topbar h1{font-size:20px;}
  .topbar .sub{color:var(--muted);font-size:13px;margin-top:2px;}
  .today-chip{
    background:var(--blue-light);color:var(--blue-deep);font-weight:600;
    padding:8px 14px;border-radius:999px;font-size:13px;white-space:nowrap;
  }

  .content{padding:28px 32px 40px 32px;max-width:1200px;width:100%;}

  /* ---------- Common components ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:26px;}
  .stat-card{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;box-shadow:var(--shadow);
  }
  .stat-card .label{font-size:12.5px;color:var(--muted);font-weight:600;}
  .stat-card .value{font-family:'Fredoka',sans-serif;font-size:26px;color:var(--blue-deep);margin-top:6px;}
  .stat-card .value small{font-family:'Inter',sans-serif;font-size:13px;color:var(--muted);font-weight:500;}

  .panel{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 24px;margin-bottom:22px;box-shadow:var(--shadow);
  }
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
  .panel-head h2{font-size:17px;}
  .panel-head .desc{color:var(--muted);font-size:13px;margin-top:3px;}

  .btn{
    border:none;border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;transition:transform .1s ease, opacity .1s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--blue);color:var(--white);}
  .btn-primary:hover{background:var(--blue-deep);}
  .btn-outline{background:var(--white);color:var(--blue);border:1.5px solid var(--blue-light);}
  .btn-outline:hover{border-color:var(--blue);}
  .btn-danger{background:var(--danger-light);color:var(--danger);}
  .btn-danger:hover{background:var(--danger);color:var(--white);}
  .btn-soft{background:var(--blue-light);color:var(--blue-deep);}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px;}
  .btn[disabled]{opacity:0.45;cursor:not-allowed;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;
     padding:9px 10px;border-bottom:2px solid var(--blue-pale);}
  td{padding:11px 10px;border-bottom:1px solid var(--blue-pale);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}
  .empty-row td{text-align:center;color:var(--muted);padding:24px;font-style:normal;}

  .tag{background:var(--blue-light);color:var(--blue-deep);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;}
  .tag.day{background:#fff3e0;color:#a15c00;}
  .tag.balance-owed{background:var(--danger-light);color:var(--danger);}
  .tag.balance-clear{background:var(--success-light);color:var(--success);}

  .inline-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  .inline-tab{
    padding:8px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--white);
    color:var(--muted);font-size:13px;font-weight:600;
  }
  .inline-tab.active{background:var(--blue-deep);border-color:var(--blue-deep);color:var(--white);}

  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:14px;}
  label{font-size:12.5px;font-weight:600;color:var(--muted);display:block;margin-bottom:6px;}
  input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
    width:100%;padding:10px 12px;border-radius:999px;border:1.5px solid var(--line);
    font-size:13.5px;font-family:'Inter',sans-serif;color:var(--ink);background:var(--blue-pale);
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);background:var(--white);}

  .ingredient-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;margin-bottom:8px;align-items:end;}
  .ingredient-row .rm{padding:10px;}

  .locked-note{
    display:flex;align-items:center;gap:8px;background:var(--blue-light);color:var(--blue-deep);
    padding:10px 14px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:16px;
  }

  .meal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;}
  .meal-card{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--white);}
  .meal-card .thumb{
    width:100%;aspect-ratio:3/2;background:linear-gradient(135deg,var(--blue-light),var(--blue-pale));
    display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden;
  }
  .meal-card .thumb img{width:100%;height:100%;object-fit:cover;}
  .meal-card .body{padding:14px 15px;}
  .meal-card .body h4{font-size:15px;}
  .meal-card .body .meta{color:var(--muted);font-size:12px;margin-top:3px;}
  .meal-card .ingredients{margin-top:10px;font-size:12.5px;color:var(--ink);}
  .meal-card .ingredients div{padding:2px 0;}
  .meal-card .foot{display:flex;gap:8px;padding:0 15px 15px 15px;flex-wrap:wrap;}

  .nav-buttons{display:flex;justify-content:space-between;margin-top:8px;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(10,25,54,0.45);display:none;
    align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--white);border-radius:18px;padding:26px 26px 22px 26px;
    width:100%;max-width:460px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px -20px rgba(10,25,54,0.5);
  }
  .modal.wide{max-width:640px;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .modal-head h3{font-size:17px;}
  .modal-close{background:var(--blue-pale);border:none;border-radius:8px;width:30px;height:30px;color:var(--muted);font-size:15px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
  .helptext{font-size:12px;color:var(--muted);margin-top:-6px;margin-bottom:12px;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--white);padding:12px 20px;border-radius:10px;
    font-size:13.5px;font-weight:500;opacity:0;transition:all .25s ease;z-index:200;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .date-control{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .date-control button{white-space:nowrap;}
  .date-control input{width:145px!important;background:var(--blue-pale)!important;}
  .export-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
  .export-check{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--blue-pale);font-size:13px;}
  .export-check input{width:auto;}
  .date-note{font-size:12px;color:var(--muted);margin-top:5px;}

  @media(max-width:820px){
    .app-shell{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:relative;flex-direction:row;overflow-x:auto;padding:14px;}
    .brand{display:none;}
    .sidebar-foot{display:none;}
    .content{padding:20px;}
    .topbar{padding:16px 20px;}
    .date-control{justify-content:flex-start;}
    .date-control input{width:135px!important;}
  }

  .store-category-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:16px;}
  .store-category{border:1px solid var(--line);border-radius:14px;background:var(--white);padding:15px;box-shadow:var(--shadow);}
  .store-category h3{font-size:15px;margin-bottom:5px;}
  .store-category .cat-meta{font-size:11.5px;color:var(--muted);margin-bottom:10px;}
  .stock-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0;}
  .stock-mini{background:var(--blue-pale);border-radius:9px;padding:8px;text-align:center;}
  .stock-mini b{display:block;font-size:15px;color:var(--blue-deep);}
  .stock-mini span{font-size:10.5px;color:var(--muted);}
  .daily-menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:14px;}
  .day-menu-card{border:1px solid var(--line);border-radius:14px;padding:15px;background:var(--white);}
  .day-menu-card .day{font-weight:700;color:var(--blue-deep);font-size:13px;}
  .day-menu-card .food{font-family:'Fredoka',sans-serif;font-size:19px;margin-top:8px;}
  .day-menu-card .date{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .day-menu-card.empty{background:var(--blue-pale);}
  @media(max-width:600px){.ingredient-row{grid-template-columns:1fr 1fr}.stock-summary{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body>

<div class="app-shell">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="brand">
      <div class="badge">🍲</div>
      <div class="name">Barkalare<small>Junior &amp; Primary School — Lunch Program</small></div>
    </div>
    <button class="navlink" data-view="dashboard"><span class="ic">🏠</span> Dashboard</button>
    <button class="navlink" data-view="teachers"><span class="ic">👩‍🏫</span> Teachers</button>
    <button class="navlink" data-view="weekly"><span class="ic">📅</span> Weekly Menu</button>
    <button class="navlink" data-view="students"><span class="ic">🎒</span> Students</button>
    <button class="navlink" data-view="payments"><span class="ic">💳</span> Payments</button>
    <button class="navlink" data-view="store"><span class="ic">🧺</span> Store</button>

    <div class="sidebar-foot">
      <div class="admin-pill">
        <div class="who">Signed in as<b id="whoLabel">Viewer</b></div>
        <button class="pill-btn" id="adminBtn">Admin</button>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main-wrap">
    <div class="topbar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="sub" id="pageSub">Overview for the selected date</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <div class="today-chip" id="todayChip">—</div>
        <div id="dateNavWrap"></div>
      </div>
    </div>
    <div class="content" id="mainContent"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
// Import the functions you need from the SDKs you need
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyDyreUJ7KTP0j0IzUaJpoX7IJf3vvypYAQ",
  authDomain: "lunch-program-bar.firebaseapp.com",
  projectId: "lunch-program-bar",
  storageBucket: "lunch-program-bar.firebasestorage.app",
  messagingSenderId: "541771024900",
  appId: "1:541771024900:web:531b45e0e5f7ac4bbc4351",
  measurementId: "G-884DJ5JW9E"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

/* =========================================================
   BARKALARE JUNIOR & PRIMARY SCHOOL — LUNCH PROGRAM SYSTEM
   Single-file app. Data persists in this browser via localStorage.
   Admin password required for any add / edit / remove action.
   ========================================================= */

const ADMIN_PASSWORD = "23456";
const STORAGE_KEY = "barkalare_lunch_v2";
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday"];
const GRADES = ["Grade 1","Grade 2","Grade 3","Grade 4","Grade 5","Grade 6","Grade 7","Grade 8","Grade 9"];

let state = loadState();
let currentView = "dashboard";
let selectedDate = todayISO();
let studentsTab = "list";   // list | grades | lunch | food
let storeTab = "food";      // food | students
let weeklyDay = DAYS.includes(weekdayName(todayISO())) ? weekdayName(todayISO()) : "Monday";
let pendingAdminAction = null; // function to run once admin logs in

/* ---------------- persistence ---------------- */
function defaultState(){
  return {
    admin:false,
    teachers:[],   // {id,name,day,date}
    entries:[],    // {id,teacherId,date,meal,items:[{name,qty,unit}],image}  — one own record per date
    students:[],   // {id,name,gradeId,admissionNo,gender,allergies,fee,paid}
    lunchList:[],  // {id,date,studentId} — the school's daily list, own record per date
    storeCategories:[{id:"cat_general",name:"General Food"}], // {id,name} — admin can create food subfields/categories
    storeItems:[], // {id,categoryId,name,unit,total}
    storeLog:[]    // {id,date,type,itemName,categoryId,qty,unit,note} — own record per date
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const merged = Object.assign(defaultState(), parsed, {admin:false});
    if(!Array.isArray(merged.storeCategories) || !merged.storeCategories.length){
      merged.storeCategories = [{id:"cat_general",name:"General Food"}];
    }
    merged.storeItems = (merged.storeItems||[]).map(i=>Object.assign({},i,{categoryId:i.categoryId||"cat_general"}));
    merged.storeLog = (merged.storeLog||[]).map(l=>Object.assign({},l,{categoryId:l.categoryId||"cat_general"}));
    return merged;
  }catch(e){ return defaultState(); }
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function weekdayName(iso){
  return new Date(iso+"T00:00:00").toLocaleDateString("en-US",{weekday:"long"});
}
function fmtDate(iso){
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
}
function money(n){ return "KSh " + (Number(n)||0).toLocaleString(); }

/* ---------------- toast ---------------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"),2200);
}

/* ---------------- admin gate ---------------- */
function requireAdmin(action){
  if(state.admin){ action(); return; }
  pendingAdminAction = action;
  openModal(adminLoginModal());
}
function adminLoginModal(){
  return {
    title:"Admin login required",
    body:`
      <p class="helptext" style="margin-bottom:14px;">Only the admin can add, edit or remove records — this keeps daily meals and lists as something the school decides, not the students. Enter the admin password to continue.</p>
      <label>Password</label>
      <input type="password" id="adminPwInput" placeholder="Enter admin password" autofocus>
      <div id="adminPwError" style="color:var(--danger);font-size:12.5px;margin-top:8px;display:none;">Incorrect password. Try again.</div>
    `,
    actions:`
      <button class="btn btn-outline" id="closeModalBtn">Cancel</button>
      <button class="btn btn-primary" id="submitAdminLoginBtn">Log in</button>
    `
  };
}
window.submitAdminLogin = function submitAdminLogin(){
  const val = document.getElementById("adminPwInput").value;
  if(val === ADMIN_PASSWORD){
    state.admin = true;
    closeModal();
    renderSidebarAdmin();
    toast("Welcome back, Admin ✓");
    if(pendingAdminAction){ const a=pendingAdminAction; pendingAdminAction=null; a(); }
    render();
  }else{
    document.getElementById("adminPwError").style.display = "block";
  }
}
function logoutAdmin(){
  state.admin = false;
  renderSidebarAdmin();
  toast("Logged out. Now viewing only.");
  render();
}
function renderSidebarAdmin(){
  document.getElementById("whoLabel").textContent = state.admin ? "Administrator" : "Viewer";
  const btn = document.getElementById("adminBtn");
  btn.textContent = state.admin ? "Logout" : "Admin";
}

/* ---------------- modal helpers ---------------- */
function openModal({title, body, actions, wide}){
  document.getElementById("modalBox").className = "modal" + (wide ? " wide":"");
  document.getElementById("modalBox").innerHTML = `
    <div class="modal-head"><h3>${title}</h3><button class="modal-close" id="modalCloseX">✕</button></div>
    <div>${body}</div>
    <div class="modal-actions">${actions}</div>
  `;
  document.getElementById("modalOverlay").classList.add("open");
  
  const closeBtn = document.getElementById("modalCloseX");
  if(closeBtn) closeBtn.onclick = closeModal;
  const cancelBtn = document.getElementById("closeModalBtn");
  if(cancelBtn) cancelBtn.onclick = closeModal;
  const loginBtn = document.getElementById("submitAdminLoginBtn");
  if(loginBtn) loginBtn.onclick = window.submitAdminLogin;
}
window.closeModal = function closeModal(){
  document.getElementById("modalOverlay").classList.remove("open");
}

/* ---------------- date handling ---------------- */
function normalizeSelectedDate(){
  if(!selectedDate || !/^\d{4}-\d{2}-\d{2}$/.test(selectedDate)) selectedDate = todayISO();
}
window.shiftDate = function shiftDate(days){
  normalizeSelectedDate();
  const d = new Date(selectedDate+"T00:00:00");
  d.setDate(d.getDate()+days);
  selectedDate = d.toISOString().slice(0,10);
  render();
}
window.setSelectedDate = function setSelectedDate(v){
  if(!v) return;
  selectedDate = v;
  render();
}
function dateNavigatorHTML(){
  normalizeSelectedDate();
  return `<div class="date-control">
    <button class="btn btn-outline btn-sm" onclick="shiftDate(-1)">← Previous</button>
    <input type="date" value="${selectedDate}" onchange="setSelectedDate(this.value)" aria-label="Select date">
    <button class="btn btn-soft btn-sm" onclick="setSelectedDate(todayISO())">Today</button>
    <button class="btn btn-outline btn-sm" onclick="shiftDate(1)">Next →</button>
  </div>`;
}
function nextDateForWeekday(targetWeekday, fromISO){
  let d = new Date((fromISO||todayISO())+"T00:00:00");
  for(let i=0;i<8;i++){
    if(d.toLocaleDateString("en-US",{weekday:"long"})===targetWeekday) return d.toISOString().slice(0,10);
    d.setDate(d.getDate()+1);
  }
  return fromISO||todayISO();
}

/* ---------------- navigation ---------------- */
const VIEW_ORDER = ["dashboard","teachers","weekly","students","payments","store"];
const VIEW_META = {
  dashboard:{title:"Dashboard", sub:"Overview for the selected date"},
  teachers:{title:"Teachers", sub:"Cooking roster and meals recorded per date"},
  weekly:{title:"Weekly Menu", sub:"Each weekday — Monday to Friday — has its own page"},
  students:{title:"Students", sub:"Grades, and daily lunch/food records decided by the school"},
  payments:{title:"Payments", sub:"Lunch fees, amount paid and balance per student"},
  store:{title:"Store", sub:"Food subfields, dated stock, remaining quantities and student records"}
};
document.querySelectorAll(".navlink").forEach(btn=>{
  btn.addEventListener("click",()=>goTo(btn.dataset.view));
});
window.goTo = function goTo(view){
  currentView = view;
  document.querySelectorAll(".navlink").forEach(b=>b.classList.toggle("active", b.dataset.view===view));
  document.getElementById("pageTitle").textContent = VIEW_META[view].title;
  document.getElementById("pageSub").textContent = VIEW_META[view].sub;
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}
window.goNext = function goNext(){
  const i = VIEW_ORDER.indexOf(currentView);
  goTo(VIEW_ORDER[(i+1) % VIEW_ORDER.length]);
}
window.goBack = function goBack(){
  const i = VIEW_ORDER.indexOf(currentView);
  goTo(VIEW_ORDER[(i-1+VIEW_ORDER.length) % VIEW_ORDER.length]);
}
function navButtons(){
  return `<div class="nav-buttons">
    <button class="btn btn-outline" onclick="goBack()">← Back</button>
    <button class="btn btn-outline" onclick="goNext()">Next →</button>
  </div>`;
}

/* ================= RENDER ROOT ================= */
function render(){
  normalizeSelectedDate();
  const chip = document.getElementById("todayChip");
  if(chip) chip.textContent = weekdayName(selectedDate) + " · " + fmtDate(selectedDate);
  const navWrap = document.getElementById("dateNavWrap");
  if(navWrap) navWrap.innerHTML = dateNavigatorHTML();
  const main = document.getElementById("mainContent");
  if(currentView === "dashboard") main.innerHTML = renderDashboard();
  else if(currentView === "teachers") main.innerHTML = renderTeachers();
  else if(currentView === "weekly") main.innerHTML = renderWeekly();
  else if(currentView === "students") main.innerHTML = renderStudents();
  else if(currentView === "payments") main.innerHTML = renderPayments();
  else if(currentView === "store") main.innerHTML = renderStore();
  saveState();
}

/* ================= DASHBOARD ================= */
function renderDashboard(){
  const date = selectedDate;
  const weekday = weekdayName(date);
  const totalStudents = state.students.length;
  const totalTeachers = state.teachers.length;
  const todaysTeacher = state.teachers.find(t=>t.day===weekday);
  const todaysEntry = state.entries.find(e=>e.date===date);
  const totalStoreRemaining = state.storeItems.reduce((s,i)=>s+Number(i.total||0),0);
  const totalBalanceOwed = state.students.reduce((s,st)=>s+Math.max(0,(Number(st.fee)||0)-(Number(st.paid)||0)),0);
  const totalCollected = state.students.reduce((s,st)=>s+(Number(st.paid)||0),0);
  const onLunchList = state.lunchList.filter(l=>l.date===date).length;

  return `
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Teachers registered</div><div class="value">${totalTeachers}</div></div>
      <div class="stat-card"><div class="label">Students registered</div><div class="value">${totalStudents}</div></div>
      <div class="stat-card"><div class="label">On lunch list — ${fmtDate(date)}</div><div class="value">${onLunchList}</div></div>
      <div class="stat-card"><div class="label">Store items remaining</div><div class="value">${totalStoreRemaining} <small>units</small></div></div>
      <div class="stat-card"><div class="label">Total collected</div><div class="value">${money(totalCollected)}</div></div>
      <div class="stat-card"><div class="label">Balance owed</div><div class="value">${money(totalBalanceOwed)}</div></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div><h2>Cooking — ${weekday}</h2><div class="desc">${fmtDate(date)} · this date has its own complete record</div></div>
        <button class="btn btn-soft" onclick="goTo('weekly')">Open ${weekday}'s page →</button>
      </div>
      ${ todaysTeacher ? `
        <p style="font-size:14px;">On duty: <strong>${escapeHtml(todaysTeacher.name)}</strong></p>
        ${ todaysEntry ? `
          <div class="meal-grid" style="margin-top:14px;">${mealCard(todaysEntry, todaysTeacher)}</div>
        ` : `<p style="margin-top:10px;color:var(--muted);font-size:13.5px;">No meal has been recorded for ${fmtDate(date)} yet.</p>` }
      ` : `<p style="color:var(--muted);font-size:13.5px;">No teacher is assigned to ${weekday} yet. Add one under Teachers.</p>` }
    </div>

    <div class="panel">
      <div class="panel-head">
        <div><h2>Admin data downloads</h2><div class="desc">Choose exactly the records you want and download them as Word or PDF.</div></div>
        <button class="btn btn-primary" onclick="requireAdmin(()=>openExportModal())">⬇ Download data</button>
      </div>
    </div>

    ${navButtons()}
  `;
}

/* ================= TEACHERS ================= */
function renderTeachers(){
  const rows = state.teachers.map(t=>`
    <tr>
      <td><span class="tag day">${escapeHtml(t.day)}</span></td>
      <td>${escapeHtml(t.name)}</td>
      <td>${t.date?fmtDate(t.date):"Weekly roster"}</td>
      <td>
        <div class="row-actions">
          <button class="btn btn-sm btn-outline" onclick="editTeacher('${t.id}')" ${state.admin?'':'disabled'}>Edit</button>
          <button class="btn btn-sm btn-danger" onclick="removeTeacher('${t.id}')" ${state.admin?'':'disabled'}>Remove</button>
        </div>
      </td>
    </tr>
  `).join("") || `<tr class="empty-row"><td colspan="4">No teachers added yet.</td></tr>`;

  const entriesSorted = [...state.entries].sort((a,b)=> b.date.localeCompare(a.date));
  const entryCards = entriesSorted.map(e=>{
    const t = state.teachers.find(x=>x.id===e.teacherId);
    return mealCard(e, t);
  }).join("") || `<p style="color:var(--muted);font-size:13.5px;">No meals recorded yet.</p>`;

  return `
    ${!state.admin ? adminLockedNote() : ""}

    <div class="panel">
      <div class="panel-head">
        <div><h2>Cooking roster</h2><div class="desc">Each teacher is assigned a day of the week, with an optional specific date</div></div>
        <button class="btn btn-primary" onclick="requireAdmin(()=>openTeacherModal())">+ Add teacher</button>
      </div>
      <table>
        <thead><tr><th>Day</th><th>Teacher</th><th>Date</th><th style="text-align:right;">Actions</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div><h2>Record a meal</h2><div class="desc">Selected date: <strong>${fmtDate(selectedDate)}</strong>. What was prepared and brought, saved against this date only.</div></div>
        <button class="btn btn-primary" onclick="requireAdmin(()=>openEntryModal())" ${state.teachers.length? '' : 'disabled'}>+ Add meal entry</button>
      </div>
      ${ state.teachers.length ? "" : `<p style="color:var(--muted);font-size:13px;">Add at least one teacher first.</p>` }
      <p class="date-note">Use the date navigator at the top of the page to move to another date — new records are saved against whichever date is selected and never overwrite another date's record.</p>
      <div class="meal-grid" style="margin-top:6px;">${entryCards}</div>
    </div>

    ${navButtons()}
  `;
}
function adminLockedNote(){
  return `<div class="locked-note">🔒 Viewing only — log in as admin to add, edit or remove records.</div>`;
}
function mealCard(entry, teacher){
  const thumb = entry.image
    ? `<img src="${entry.image}" alt="${escapeHtml(entry.meal)}">`
    : `🍽️`;
  const ingredientLines = (entry.items||[]).map(i=>`<div>• ${escapeHtml(i.name)} — ${i.qty} ${escapeHtml(i.unit)}</div>`).join("");
  return `
    <div class="meal-card">
      <div class="thumb">${thumb}</div>
      <div class="body">
        <h4>${escapeHtml(entry.meal)}</h4>
        <div class="meta">${teacher ? escapeHtml(teacher.name) : "—"} · ${fmtDate(entry.date)} · ${escapeHtml(weekdayName(entry.date))}</div>
        <div class="ingredients">${ingredientLines || "<em style='color:var(--muted)'>No ingredients logged</em>"}</div>
      </div>
      <div class="foot">
        <button class="btn btn-sm btn-soft" onclick="generatePicture('${entry.id}')">🖼️ ${entry.image ? "Regenerate" : "Generate"} picture</button>
        ${entry.image ? `<button class="btn btn-sm btn-outline" onclick="downloadEntryImage('${entry.id}')">Download</button>` : ""}
        <button class="btn btn-sm btn-danger" onclick="removeEntry('${entry.id}')" ${state.admin?'':'disabled'}>Remove</button>
      </div>
    </div>
  `;
}

function openTeacherModal(existing){
  const t = existing || {id:null,name:"",day:DAYS[0],date:selectedDate};
  openModal({
    title: existing ? "Edit teacher" : "Add teacher",
    body:`
      <label>Teacher's name</label>
      <input type="text" id="tName" value="${escapeAttr(t.name)}" placeholder="e.g. Mrs. Jepkosgei">
      <div style="height:12px;"></div>
      <div class="form-grid">
        <div><label>Cooking day</label>
        <select id="tDay">${DAYS.map(d=>`<option value="${d}" ${d===t.day?'selected':''}>${d}</option>`).join("")}</select></div>
        <div><label>Assignment date (optional)</label><input type="date" id="tDate" value="${t.date||selectedDate}"></div>
      </div>
      <div class="date-note">Leave this on the selected date, or pick another — the assignment date is saved with the teacher's record.</div>
    `,
    actions:`
      <button class="btn btn-outline" id="closeModalBtn">Cancel</button>
      <button class="btn btn-primary" id="saveTeacherBtn">Save</button>
    `
  });
  document.getElementById("saveTeacherBtn").onclick = () => saveTeacher(t.id||'');
}
function saveTeacher(id){
  const name = document.getElementById("tName").value.trim();
  const day = document.getElementById("tDay").value;
  const date = document.getElementById("tDate").value || selectedDate;
  if(!name){ toast("Please enter the teacher's name"); return; }
  if(id){
    const t = state.teachers.find(x=>x.id===id);
    t.name=name; t.day=day; t.date=date;
    toast("Teacher updated");
  }else{
    state.teachers.push({id:uid(), name, day, date});
    toast("Teacher added");
  }
  closeModal(); render();
}
window.editTeacher = function editTeacher(id){
  requireAdmin(()=> openTeacherModal(state.teachers.find(t=>t.id===id)) );
}
window.removeTeacher = function removeTeacher(id){
  requireAdmin(()=>{
    if(!confirm("Remove this teacher and keep their past meal entries?")) return;
    state.teachers = state.teachers.filter(t=>t.id!==id);
    toast("Teacher removed");
    render();
  });
}

    title:"Record meal for " + fmtDate(selectedDate),

        <div>
          <label>Teacher</label>

        </div>
        <div>
          <label>Date</label>
          <input type="date" id="eDate" value="${selectedDate}">
        </div>
      </div>
      <label>Meal prepared</label>

function openEntryModalForDate(date){
  const prev = selectedDate;
  selectedDate = date;
  openEntryModal();
  selectedDate = prev;
}
function addIngredientRow(){
  const wrap = document.getElementById("ingredientRows");
  const id = "row_"+uid();
  const div = document.createElement("div");
  div.className="ingredient-row";
  div.id=id;
  div.innerHTML = `
    <div><label>Item</label><input type="text" class="ing-name" placeholder="e.g. Maize"></div>
    <div><label>Qty</label><input type="number" class="ing-qty" min="0" step="0.1" placeholder="0"></div>
    <div><label>Unit</label><input type="text" class="ing-unit" placeholder="kg / litres / pcs"></div>
    <button type="button" class="btn btn-sm btn-danger rm" id="rm_${id}">✕</button>
  `;
  wrap.appendChild(div);
  document.getElementById(`rm_${id}`).onclick = () => document.getElementById(id).remove();
}
function saveEntry(){
  const teacherId = document.getElementById("eTeacher").value;
  const date = document.getElementById("eDate").value || selectedDate;
  const meal = document.getElementById("eMeal").value.trim();
  if(!teacherId){ toast("Please add a teacher first"); return; }
  if(!meal){ toast("Please enter the meal prepared"); return; }
  const items = [];
  document.querySelectorAll("#ingredientRows .ingredient-row").forEach(row=>{
    const name = row.querySelector(".ing-name").value.trim();
    const qty = row.querySelector(".ing-qty").value;
    const unit = row.querySelector(".ing-unit").value.trim();
    if(name && qty) items.push({name, qty:Number(qty), unit: unit || "units"});
  });
  state.entries.push({id:uid(), teacherId, date, meal, items, image:null});
  selectedDate = date;
  toast("Meal recorded for " + fmtDate(date));
  closeModal(); render();
}
window.removeEntry = function removeEntry(id){
  requireAdmin(()=>{
    if(!confirm("Remove this meal entry?")) return;
    state.entries = state.entries.filter(e=>e.id!==id);
    toast("Meal entry removed");
    render();
  });
}

/* ---------------- meal picture generator ---------------- */
window.generatePicture = function generatePicture(entryId){
  const entry = state.entries.find(e=>e.id===entryId);
  if(!entry) return;
  const teacher = state.teachers.find(t=>t.id===entry.teacherId);

  const canvas = document.createElement("canvas");
  canvas.width = 900; canvas.height = 600;
  const ctx = canvas.getContext("2d");

  const grad = ctx.createLinearGradient(0,0,900,600);
  grad.addColorStop(0,"#0a3d8f");
  grad.addColorStop(1,"#2e7bf0");
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,900,600);

  ctx.globalAlpha = 0.12;
  ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.arc(830,60,120,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(40,560,150,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;

  roundRect(ctx, 60, 60, 780, 480, 24);
  ctx.fillStyle = "#ffffff";
  ctx.fill();

  ctx.fillStyle = "#0a3d8f";
  ctx.font = "600 20px Georgia, serif";
  ctx.fillText("BARKALARE JUNIOR & PRIMARY SCHOOL", 100, 110);
  ctx.font = "14px Arial";
  ctx.fillStyle = "#5b7194";
  ctx.fillText("Lunch Program — Meal of the Day", 100, 132);

  ctx.font = "58px Arial";
  ctx.fillText(pickEmojiForMeal(entry.meal), 100, 210);

  ctx.fillStyle = "#0f2647";
  ctx.font = "700 34px Georgia, serif";
  wrapText(ctx, entry.meal, 210, 195, 590, 38);

  ctx.font = "16px Arial";
  ctx.fillStyle = "#5b7194";
  ctx.fillText((teacher?teacher.name:"—") + "  ·  " + fmtDate(entry.date), 210, 232);

  ctx.strokeStyle = "#dbe6f8";
  ctx.beginPath(); ctx.moveTo(100,260); ctx.lineTo(800,260); ctx.stroke();

  ctx.fillStyle = "#0a3d8f";
  ctx.font = "700 16px Arial";
  ctx.fillText("INGREDIENTS BROUGHT", 100, 292);

  ctx.font = "16px Arial";
  ctx.fillStyle = "#0f2647";
  let y = 322;
  (entry.items && entry.items.length ? entry.items : [{name:"No ingredients logged",qty:"",unit:""}]).forEach(it=>{
    const line = it.qty !== "" ? `•  ${it.name} — ${it.qty} ${it.unit}` : `•  ${it.name}`;
    ctx.fillText(line, 100, y);
    y += 28;
    if(y > 480) return;
  });

  ctx.font = "italic 13px Arial";
  ctx.fillStyle = "#5b7194";
  ctx.fillText("Decided and prepared by the school, with care for our learners 🍲", 100, 510);

  entry.image = canvas.toDataURL("image/png");
  toast("Picture generated");
  render();
}
function pickEmojiForMeal(name){
  const n = (name||"").toLowerCase();
  if(n.includes("rice")) return "🍚";
  if(n.includes("beans")) return "🫘";
  if(n.includes("githeri")) return "🌽";
  if(n.includes("ugali")) return "🍽️";
  if(n.includes("chapati")) return "🫓";
  if(n.includes("stew")||n.includes("meat")||n.includes("beef")) return "🍖";
  if(n.includes("cabbage")||n.includes("sukuma")||n.includes("veg")) return "🥬";
  if(n.includes("egg")) return "🍳";
  if(n.includes("porridge")) return "🥣";
  if(n.includes("fish")) return "🐟";
  if(n.includes("potato")||n.includes("mash")) return "🥔";
  return "🍲";
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function wrapText(ctx,text,x,y,maxWidth,lineHeight){
  const words = (text||"").split(" ");
  let line = "";
  let curY = y;
  for(let n=0;n<words.length;n++){
    const test = line + words[n] + " ";
    if(ctx.measureText(test).width > maxWidth && n>0){
      ctx.fillText(line, x, curY);
      line = words[n] + " ";
      curY += lineHeight;
    }else{
      line = test;
    }
  }
  ctx.fillText(line, x, curY);
}
window.downloadEntryImage = function downloadEntryImage(entryId){
  const entry = state.entries.find(e=>e.id===entryId);
  if(!entry || !entry.image) return;
  const a = document.createElement("a");
  a.href = entry.image;
  a.download = "meal-"+entry.date+".png";
  a.click();
}

/* ================= WEEKLY MENU ================= */
function renderWeekly(){
  if(!DAYS.includes(weeklyDay)) weeklyDay = "Monday";
  const tabs = DAYS.map(d=>`<button class="inline-tab ${weeklyDay===d?'active':''}" onclick="setWeeklyDay('${d}')">${d}</button>`).join("");
  const teacher = state.teachers.find(t=>t.day===weeklyDay);
  const nearestDate = weekdayName(selectedDate)===weeklyDay ? selectedDate : nextDateForWeekday(weeklyDay, selectedDate);
  const nearestEntry = state.entries.find(e=>e.date===nearestDate);
  const entriesForDay = state.entries.filter(e=>weekdayName(e.date)===weeklyDay).sort((a,b)=>b.date.localeCompare(a.date));

  return `
    ${!state.admin ? adminLockedNote() : ""}
    <div class="inline-tabs">${tabs}</div>

    <div class="panel">
      <div class="panel-head">
        <div><h2>${weeklyDay}'s page</h2><div class="desc">Its own cook and its own meal history — separate from every other weekday.</div></div>
        <button class="btn btn-primary" onclick="requireAdmin(()=>openEntryModalForDate('${nearestDate}'))" ${state.teachers.length?'':'disabled'}>+ Record ${weeklyDay}'s meal</button>
      </div>
      ${ teacher ? `<p style="font-size:14px;">On duty every ${weeklyDay}: <strong>${escapeHtml(teacher.name)}</strong></p>`
                 : `<p style="color:var(--muted);font-size:13.5px;">No teacher is assigned to ${weeklyDay} yet. Add one under Teachers.</p>` }
      ${ nearestEntry ? `
        <div style="margin-top:12px;font-size:12.5px;color:var(--muted);font-weight:600;">Nearest ${weeklyDay} — ${fmtDate(nearestDate)}</div>
        <div class="meal-grid" style="margin-top:8px;">${mealCard(nearestEntry, teacher)}</div>
      ` : `<p style="margin-top:10px;color:var(--muted);font-size:13.5px;">No meal recorded for ${weeklyDay}, ${fmtDate(nearestDate)}, yet.</p>` }
    </div>

    <div class="panel">
      <div class="panel-head"><div><h2>${weeklyDay} — full history</h2><div class="desc">Every ${weeklyDay} that has been recorded, each on its own date.</div></div></div>
      <div class="meal-grid">${
        entriesForDay.map(e=>mealCard(e, state.teachers.find(t=>t.id===e.teacherId))).join("")
        || `<p style="color:var(--muted);font-size:13.5px;">No ${weeklyDay} meals recorded yet.</p>`
      }</div>
    </div>

    ${navButtons()}
  `;
}
window.setWeeklyDay = function setWeeklyDay(d){ weeklyDay = d; render(); }

  ).join("") || `<tr class="empty-row"><td colspan="6">No students added yet.</td></tr>`;

  return `
    <div class="panel">
      <div class="panel-head">
        <div><h2>All students</h2><div class="desc">Full characteristics per student — grade, admission number, gender — so no two students are confused.</div></div>

      <table><thead><tr><th>Name</th><th>Grade</th><th>Admission No.</th><th>Gender</th><th>Lunch fee</th><th style="text-align:right;">Actions</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>
  `;
}
function openStudentModal(existing){
  const st = existing || {id:null,name:"",gradeId:GRADES[0],admissionNo:"",gender:"",allergies:"",fee:0,paid:0};
  openModal({
    wide:true,
    title: existing ? "Edit student" : "Add student",

          <input type="text" id="stAdm" value="${escapeAttr(st.admissionNo||"")}" placeholder="e.g. BJP-0231">
        </div>

          <label>Gender</label>
          <select id="stGender">

      <input type="text" id="stAllergy" value="${escapeAttr(st.allergies||"")}" placeholder="e.g. no peanuts">

             <button class="btn btn-primary" id="saveStudentBtn">Save</button>`
  });
  document.getElementById("saveStudentBtn").onclick = () => saveStudent(st.id||'');
}
function saveStudent(id){
  const name = document.getElementById("stName").value.trim();
  const gradeId = document.getElementById("stGrade").value;
  const admissionNo = document.getElementById("stAdm").value.trim();
  const gender = document.getElementById("stGender").value;
  const fee = Number(document.getElementById("stFee").value)||0;
  const allergies = document.getElementById("stAllergy").value.trim();
  if(!name){ toast("Please enter the student's name"); return; }
  if(id){
    const st = state.students.find(x=>x.id===id);
    st.name=name; st.gradeId=gradeId; st.admissionNo=admissionNo; st.gender=gender; st.fee=fee; st.allergies=allergies;
    toast("Student updated");
  }else{
    state.students.push({id:uid(), name, gradeId, admissionNo, gender, allergies, fee, paid:0});
    toast("Student added");
  }
  closeModal(); render();
}
window.editStudent = function editStudent(id){ requireAdmin(()=> openStudentModal(state.students.find(s=>s.id===id)) ); }
window.removeStudent = function removeStudent(id){
  requireAdmin(()=>{
    if(!confirm("Remove this student?")) return;
    state.students = state.students.filter(s=>s.id!==id);
    state.lunchList = state.lunchList.filter(l=>l.studentId!==id);
    toast("Student removed"); render();
  });
}

function renderDailyLunch(){
  const entryForDay = state.entries.find(e=>e.date===selectedDate);
  const onList = state.lunchList.filter(l=>l.date===selectedDate);
  const rows = onList.map(l=>{
    const st = state.students.find(s=>s.id===l.studentId);
    return `<tr>
      <td>${st ? escapeHtml(st.name) : "<em>(removed student)</em>"}</td>
      <td>${st ? escapeHtml(st.gradeId||"—") : "—"}</td>
      <td><div class="row-actions">
        <button class="btn btn-sm btn-danger" onclick="removeFromLunch('${l.id}')" ${state.admin?'':'disabled'}>Remove</button>
      </div></td>
    </tr>`;
  }).join("") || `<tr class="empty-row"><td colspan="3">No students placed on the lunch list for this date yet.</td></tr>`;

  const availableStudents = state.students.filter(s=>!onList.some(l=>l.studentId===s.id));

  return `
    <div class="panel">
      <div class="locked-note">🏫 The school decides and prepares the daily lunch list — students do not select themselves onto it.</div>
      <div class="panel-head">
        <div><h2>Lunch list — ${fmtDate(selectedDate)}</h2><div class="desc">Meal: <strong>${entryForDay ? escapeHtml(entryForDay.meal) : "not recorded yet"}</strong></div></div>
      </div>

      <div style="display:flex;gap:10px;align-items:end;margin-bottom:16px;flex-wrap:wrap;">
        <div style="min-width:220px;">
          <label>Place a student on this date's list</label>
          <select id="addLunchStudent">
            <option value="">Select student…</option>
            ${availableStudents.map(s=>`<option value="${s.id}">${escapeHtml(s.name)} — ${escapeHtml(s.gradeId||"—")}</option>`).join("")}
          </select>
        </div>
        <button class="btn btn-primary" onclick="requireAdmin(()=>addToLunch())">+ Add student</button>
      </div>

      <table><thead><tr><th>Student</th><th>Grade</th><th style="text-align:right;">Actions</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>
  `;
}
window.addToLunch = function addToLunch(){
  const sel = document.getElementById("addLunchStudent");
  const studentId = sel.value;
  if(!studentId){ toast("Please select a student"); return; }
  const exists = state.lunchList.some(l=>l.date===selectedDate && l.studentId===studentId);
  if(exists){ toast("Student is already on this date's list"); return; }
  state.lunchList.push({id:uid(), date:selectedDate, studentId});
  toast("Student added to lunch list for "+fmtDate(selectedDate));
  render();
}
window.removeFromLunch = function removeFromLunch(id){
  requireAdmin(()=>{
    state.lunchList = state.lunchList.filter(l=>l.id!==id);
    toast("Removed from lunch list"); render();
  });
}

function renderDailyFood(){
  const date=selectedDate;
  const entry=state.entries.find(e=>e.date===date);
  const onList=state.lunchList.filter(l=>l.date===date).length;
  const weekMenu=DAYS.map(day=>{
    const target=weekdayName(date)===day ? date : nextDateForWeekday(day,date);
    const e=state.entries.find(x=>x.date===target);
    return `<div class="day-menu-card ${e?'':'empty'}">
      <div class="day">${day}</div>
      <div class="food">${e?escapeHtml(e.meal):"Not recorded"}</div>
      <div class="date">${fmtDate(target)}</div>
      ${e?`<div style="font-size:11.5px;color:var(--muted);margin-top:6px;">Teacher: ${escapeHtml((state.teachers.find(t=>t.id===e.teacherId)||{}).name||"—")}</div>`:""}
    </div>`;
  }).join("");

  return `
    <div class="panel">
      <div class="locked-note">🏫 Daily food is decided and prepared by the school — students can view the menu but do not select it.</div>
      <div class="panel-head">
        <div><h2>Today's food — ${fmtDate(date)}</h2><div class="desc">The meal shown here belongs only to this exact date.</div></div>
      </div>
      ${entry ? `
        <div class="meal-grid">${mealCard(entry,state.teachers.find(t=>t.id===entry.teacherId))}</div>
        <div style="margin-top:16px;padding:12px;background:var(--blue-pale);border-radius:10px;font-size:13px;">
          <strong>Students:</strong> ${state.students.length} registered · ${onList} placed on the lunch list for ${fmtDate(date)}.
        </div>` :
        `<div style="padding:25px;text-align:center;color:var(--muted);">No food has been recorded for ${fmtDate(date)} yet. Admin can record it under Teachers or Weekly Menu.</div>`}
    </div>

    <div class="panel">
      <div class="panel-head">
        <div><h2>Student weekly food view</h2><div class="desc">Monday, Tuesday, Wednesday, Thursday and Friday stay separate. Each day shows its own recorded meal and date.</div></div>
      </div>
      <div class="daily-menu-grid">${weekMenu}</div>
    </div>

    <div class="panel">
      <div class="panel-head"><div><h2>Daily student lunch list</h2><div class="desc">Students the school has placed on this date's list.</div></div>
      <button class="btn btn-soft" onclick="setStudentsTab('lunch')">Manage lunch list →</button></div>
      ${renderDailyLunch()}
    </div>
  `;

window.setStoreTab = function setStoreTab(tab){ storeTab = tab; render(); }

function renderStoreFood(){
  const categories = state.storeCategories || [];
  const categoryCards = categories.map(cat=>{
    const items = state.storeItems.filter(i=>(i.categoryId||"cat_general")===cat.id);
    const totalRemaining = items.reduce((sum,i)=>sum+Number(i.total||0),0);
    const recent = [...state.storeLog]
      .filter(l=>(l.categoryId||"cat_general")===cat.id)
      .sort((a,b)=>b.date.localeCompare(a.date))[0];
    return `
      <div class="store-category">
        <h3>🍚 ${escapeHtml(cat.name)}</h3>
        <div class="cat-meta">${items.length} food item(s) · latest activity: ${recent?fmtDate(recent.date):"none"}</div>
        <div class="stock-summary">
          <div class="stock-mini"><b>${items.length}</b><span>Items</span></div>
          <div class="stock-mini"><b>${totalRemaining}</b><span>Remaining</span></div>
          <div class="stock-mini"><b>${state.storeLog.filter(l=>(l.categoryId||"cat_general")===cat.id).length}</b><span>Entries</span></div>
        </div>
        ${items.length ? `<div style="font-size:12px;">${items.map(i=>`<div style="padding:4px 0;border-top:1px solid var(--blue-pale);display:flex;justify-content:space-between;gap:8px;"><span>${escapeHtml(i.name)}</span><strong>${i.total} ${escapeHtml(i.unit)}</strong></div>`).join("")}</div>` : `<div style="font-size:12px;color:var(--muted);padding:8px 0;">No items in this subfield yet.</div>`}
        <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;">
          <button class="btn btn-sm btn-primary" onclick="requireAdmin(()=>openStockModal('add','${cat.id}'))">+ Add food</button>
          <button class="btn btn-sm btn-outline" onclick="requireAdmin(()=>openStockModal('remove','${cat.id}'))">− Use food</button>
          <button class="btn btn-sm btn-outline" onclick="requireAdmin(()=>openCategoryModal('${cat.id}'))">Edit</button>
          ${cat.id!=="cat_general" ? `<button class="btn btn-sm btn-danger" onclick="removeStoreCategory('${cat.id}')">Remove</button>` : ""}
        </div>
      </div>`;
  }).join("");

  const logRows = [...state.storeLog].sort((a,b)=>b.date.localeCompare(a.date)).map(l=>{
    const cat=categories.find(c=>c.id===(l.categoryId||"cat_general"));
    const item=state.storeItems.find(i=>i.name.toLowerCase()===String(l.itemName).toLowerCase() && (i.categoryId||"cat_general")===(l.categoryId||"cat_general"));
    return `<tr>
      <td>${fmtDate(l.date)}</td>
      <td><span class="tag day">${escapeHtml(cat?cat.name:"General Food")}</span></td>
      <td>${escapeHtml(l.itemName)}</td>
      <td>${l.type==='add' ? `<span class="tag balance-clear">Added</span>` : `<span class="tag balance-owed">Used</span>`}</td>
      <td>${l.qty} ${escapeHtml(l.unit)}</td>
      <td><strong>${item?item.total:"—"}</strong></td>
      <td>${escapeHtml(l.note||"—")}</td>
    </tr>`;
  }).join("") || `<tr class="empty-row"><td colspan="7">No store activity yet.</td></tr>`;

  return `
    <div class="panel">
      <div class="panel-head">
        <div><h2>Food Store Subfields</h2><div class="desc">Create separate food areas such as <strong>Maize</strong>, <strong>Beans</strong>, <strong>Cabbage</strong>, Rice, etc. Each subfield keeps its own items and remaining stock.</div></div>
        <button class="btn btn-primary" onclick="requireAdmin(()=>openCategoryModal())">+ Add subfield</button>
      </div>
      ${categories.length ? `<div class="store-category-grid">${categoryCards}</div>` : `<p style="color:var(--muted);">No food subfields yet. Admin can add one.</p>`}
    </div>

    <div class="panel">
      <div class="panel-head">
        <div><h2>Date-based food stock records</h2><div class="desc">Every addition or use is attached to its exact date. The <strong>Remaining</strong> amount is maintained separately for each food item.</div></div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-primary" onclick="requireAdmin(()=>openStockModal('add'))">+ Add stock</button>
          <button class="btn btn-outline" onclick="requireAdmin(()=>openStockModal('remove'))">− Use stock</button>
        </div>
      </div>
      <table><thead><tr><th>Date</th><th>Subfield</th><th>Food</th><th>Action</th><th>Quantity</th><th>Remaining</th><th>Note</th></tr></thead>
      <tbody>${logRows}</tbody></table>
    </div>
  `;
}

function openCategoryModal(existingId){
  const existing = existingId ? (state.storeCategories||[]).find(c=>c.id===existingId) : null;
  openModal({
    title: existing ? "Edit food subfield" : "Add food subfield",
    body:`
      <label>Subfield / food category name</label>
      <input type="text" id="catName" value="${escapeAttr(existing?existing.name:"")}" placeholder="e.g. Maize, Beans, Cabbage">
      <div class="helptext" style="margin-top:8px;">You can create as many separate food subfields as the school needs.</div>
    `,
    actions:`<button class="btn btn-outline" id="closeModalBtn">Cancel</button>
             <button class="btn btn-primary" id="saveCategoryBtn">Save</button>`
  });
  document.getElementById("saveCategoryBtn").onclick = () => saveCategory(existingId||'');
}
function saveCategory(id){
  const name=document.getElementById("catName").value.trim();
  if(!name){toast("Enter a subfield name");return;}
  if(id){
    const c=state.storeCategories.find(x=>x.id===id);
    if(c)c.name=name;
    toast("Food subfield updated");
  }else{
    if(state.storeCategories.some(c=>c.name.toLowerCase()===name.toLowerCase())){toast("That subfield already exists");return;}
    state.storeCategories.push({id:uid(),name});
    toast("Food subfield added");
  }
  closeModal();render();
}
window.removeStoreCategory = function removeStoreCategory(id){
  requireAdmin(()=>{
    const c=state.storeCategories.find(x=>x.id===id);
    if(!c)return;
    const hasItems=state.storeItems.some(i=>(i.categoryId||"cat_general")===id);
    if(hasItems && !confirm("This subfield has food items. Remove the subfield and its item records?"))return;
    state.storeCategories=state.storeCategories.filter(x=>x.id!==id);
    state.storeItems=state.storeItems.filter(i=>(i.categoryId||"cat_general")!==id);
    state.storeLog=state.storeLog.filter(l=>(l.categoryId||"cat_general")!==id);
    toast("Food subfield removed");render();
  });
}

function openStockModal(type, categoryId){
  const categories=state.storeCategories||[];
  const selectedCategory=categoryId || (categories[0]&&categories[0].id) || "cat_general";
  const existingItems=state.storeItems.filter(i=>(i.categoryId||"cat_general")===selectedCategory).map(i=>i.name);
  openModal({
    wide:true,
    title:type==='add' ? "Add food stock" : "Use / remove food stock",
    body:`
      <div class="form-grid">
        <div>
          <label>Food subfield</label>
          <select id="stockCategory">${categories.map(c=>`<option value="${c.id}" ${c.id===selectedCategory?'selected':''}>${escapeHtml(c.name)}</option>`).join("")}</select>
        </div>
        <div>
          <label>Exact date</label>
          <input type="date" id="stockDate" value="${selectedDate}">
        </div>
      </div>
      <label>Food item</label>
      <input type="text" id="stockName" list="stockItemsList" placeholder="e.g. Maize, Beans, Cabbage">
      <datalist id="stockItemsList">${existingItems.map(n=>`<option value="${escapeAttr(n)}">`).join("")}</datalist>
      <div style="height:12px;"></div>
      <div class="form-grid">
        <div><label>Quantity</label><input type="number" id="stockQty" min="0" step="0.1" placeholder="0"></div>
        <div><label>Unit</label><input type="text" id="stockUnit" placeholder="kg / bags / litres / pcs"></div>
      </div>
      <label>${type==='add' ? "Note (optional)" : "Reason / note"}</label>
      <input type="text" id="stockNote" placeholder="${type==='add' ? "e.g. new delivery" : "e.g. used for Monday lunch"}">
      <div class="date-note">This transaction will be saved under the selected date only.</div>
    `,
    actions:`<button class="btn btn-outline" id="closeModalBtn">Cancel</button>
             <button class="btn btn-primary" id="saveStockBtn">Save</button>`
  });
  document.getElementById("saveStockBtn").onclick = () => saveStock(type);
}
function saveStock(type){
  const categoryId=document.getElementById("stockCategory").value;
  const date=document.getElementById("stockDate").value||selectedDate;
  const name=document.getElementById("stockName").value.trim();
  const qty=Number(document.getElementById("stockQty").value);
  const unit=document.getElementById("stockUnit").value.trim()||"units";
  const note=document.getElementById("stockNote").value.trim();
  if(!categoryId||!name||!qty){toast("Please enter subfield, food and quantity");return;}

  let item=state.storeItems.find(i=>i.name.toLowerCase()===name.toLowerCase() && (i.categoryId||"cat_general")===categoryId);
  if(!item){
    if(type==="remove"){toast("That food item is not in this subfield yet");return;}
    item={id:uid(),categoryId,name,unit,total:0};
    state.storeItems.push(item);
  }
  if(type==="add"){
    item.total=Number(item.total||0)+qty;
  }else{
    if(qty>Number(item.total||0)){
      if(!confirm(`Only ${item.total} ${item.unit} of ${name} remain. Use ${qty} anyway (remaining will become negative)?`))return;
    }
    item.total=Number(item.total||0)-qty;
  }
  state.storeLog.push({id:uid(),date,type,itemName:name,categoryId,qty,unit,note});
  selectedDate=date;
  toast(type==='add'?"Food stock added":"Food stock used");
  closeModal();render();
}

      <button class="btn btn-primary" id="expPdfBtn">📄 PDF</button>`
  });
  document.getElementById("expWordBtn").onclick = () => exportSelectedData('word');
  document.getElementById("expPdfBtn").onclick = () => exportSelectedData('pdf');
}

function getExportRows(){
  let from = document.getElementById("exportFrom").value || selectedDate;
  let to = document.getElementById("exportTo").value || selectedDate;
  if(from>to){ const x=from; from=to; to=x; }
  const inRange = x=>x>=from && x<=to;
  return {
    from, to,
    teachers: state.teachers,
    students: state.students,
    meals: state.entries.filter(e=>inRange(e.date)),
    lunch: state.lunchList.filter(x=>inRange(x.date)),
    store: state.storeLog.filter(x=>inRange(x.date))
  };
}
function escReport(v){ return escapeHtml(v==null?"":String(v)); }
function reportTable(headers,rows){
  return `<table class="report-table"><thead><tr>${headers.map(h=>`<th>${escReport(h)}</th>`).join("")}</tr></thead><tbody>${
    rows.length ? rows.map(r=>`<tr>${r.map(c=>`<td>${escReport(c)}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${headers.length}">No records</td></tr>`
  }</tbody></table>`;
}
function buildReportHTML(){
  const r = getExportRows();
  const sections = [];
  if(document.getElementById("exTeachers").checked)
    sections.push(`<h2>Teachers</h2>${reportTable(["Teacher","Cooking day","Assignment date"], r.teachers.map(t=>[t.name,t.day,t.date?fmtDate(t.date):"Weekly roster"]))}`);
  if(document.getElementById("exStudents").checked)
    sections.push(`<h2>Students</h2>${reportTable(["Student","Grade","Admission No.","Gender","Lunch fee","Paid","Balance"], r.students.map(s=>[s.name,s.gradeId||"—",s.admissionNo||"—",s.gender||"—",money(s.fee),money(s.paid),money(Math.max(0,(Number(s.fee)||0)-(Number(s.paid)||0)))]))}`);
  if(document.getElementById("exMeals").checked)
    sections.push(`<h2>Meals / Daily Food</h2>${reportTable(["Date","Weekday","Teacher","Meal","Ingredients"], r.meals.map(e=>{const t=state.teachers.find(x=>x.id===e.teacherId);return [fmtDate(e.date),weekdayName(e.date),t?t.name:"—",e.meal,(e.items||[]).map(i=>`${i.name}: ${i.qty} ${i.unit}`).join("; ")||"—"];}))}`);
  if(document.getElementById("exLunch").checked)
    sections.push(`<h2>Daily Lunch Lists</h2>${reportTable(["Date","Student","Grade"], r.lunch.map(l=>{const s=state.students.find(x=>x.id===l.studentId);return [fmtDate(l.date),s?s.name:"Removed student",s?s.gradeId||"—":"—"];}))}`);
  if(document.getElementById("exPayments").checked)
    sections.push(`<h2>Payments</h2>${reportTable(["Student","Grade","Fee","Paid","Balance"], r.students.map(s=>[s.name,s.gradeId||"—",money(s.fee),money(s.paid),money(Math.max(0,(Number(s.fee)||0)-(Number(s.paid)||0)))]))}`);
  if(document.getElementById("exStore").checked)
    sections.push(`<h2>Store Activity</h2>${reportTable(["Date","Type","Item","Quantity","Note"], r.store.map(x=>[fmtDate(x.date),x.type==="add"?"Added":"Removed",x.itemName,`${x.qty} ${x.unit}`,x.note||"—"]))}`);
  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Barkalare Lunch Program Report</title><style>
    body{font-family:Arial,sans-serif;color:#0f2647;margin:28px}h1{color:#0a3d8f;margin-bottom:4px}h2{color:#0a3d8f;margin-top:28px;border-bottom:2px solid #dbe6f8;padding-bottom:6px}
    .meta{color:#5b7194;margin-bottom:22px}.report-table{width:100%;border-collapse:collapse;margin:8px 0 18px;font-size:12px}.report-table th{background:#eaf2ff;color:#0a3d8f;text-align:left;padding:8px;border:1px solid #dbe6f8}.report-table td{padding:7px;border:1px solid #dbe6f8;vertical-align:top} @media print{body{margin:15mm}.report-table{page-break-inside:auto}tr{page-break-inside:avoid}}
  </style></head><body><h1>Barkalare Junior &amp; Primary School</h1><div class="meta">Lunch Program Report · ${fmtDate(r.from)} to ${fmtDate(r.to)} · Generated ${new Date().toLocaleString()}</div>${sections.join("")||"<p>No data category selected.</p>"}</body></html>`;
}
function exportSelectedData(type){
  const html = buildReportHTML();
  if(type==="word"){
    const blob = new Blob(["\ufeff",html],{type:"application/msword"});
    const url = URL.createObjectURL(blob); const a = document.createElement("a");
    a.href=url; a.download=`barkalare-lunch-report-${selectedDate}.doc`; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast("Word report downloaded");
  }else{
    const w = window.open("","_blank");
    if(!w){ toast("Please allow pop-ups to create the PDF"); return; }
    w.document.open(); w.document.write(html); w.document.close();
    setTimeout(()=>w.print(),500);
    toast("PDF print window opened");
  }
}

/* ---------------- utils ---------------- */
function escapeHtml(str){
  return String(str??"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

/* ---------------- wiring ---------------- */
document.getElementById("adminBtn").addEventListener("click",()=>{
  if(state.admin) logoutAdmin();
  else openModal(adminLoginModal());
});
document.getElementById("modalOverlay").addEventListener("click",(e)=>{
  if(e.target.id === "modalOverlay") closeModal();
});
document.getElementById("modalOverlay").addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    const pw = document.getElementById("adminPwInput");
    if(pw) window.submitAdminLogin();
  }
});

/* ---------------- boot ---------------- */
renderSidebarAdmin();
goTo("dashboard");
</script>
